[project]
name = "contoso-sources"
version = "0.1.0"
description = "The Contoso vendor systems: OpenAPI specs, simulator scripts, and the generators that make their exports reproducible."
requires-python = ">=3.12"
authors = [{name = "Calvin Cheng", email = "calvin@calvinx.com"}]
dependencies = []

# NO dependency list for the generators, deliberately. `scripts/fixtures.py`
# installs them BY URL at the tag in versions.env, so the version is written
# once. Naming them here too would be a second place to drift.

[tool.ruff]
line-length = 100
target-version = "py312"
