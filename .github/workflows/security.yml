# Secret scanning.
#
# No repo in the emulator family had any secret scanning before this: not
# gitleaks, not trufflehog, not detect-secrets, across 25 public repos. A
# scanner nobody runs is a scanner that finds nothing.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # gitleaks' rule set moves, so a repo that has not changed can still start
    # matching. A push trigger alone would leave a finished repo unwatched.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret that was committed and then removed is still in
      # the pack, still cloneable, and still leaked. Scanning only the tip
      # would report clean on exactly the case that matters most.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -fsSL -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

      - name: Scan the history
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact
